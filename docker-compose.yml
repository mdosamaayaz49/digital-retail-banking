name: nusantara
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-env.sh}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: platform-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-env.sh}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run scripts/init-env.sh}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./infrastructure/docker/nusantara-realm.json:/opt/keycloak/data/import/nusantara-realm.json:ro"]
  redis:
    image: redis:7.4.6-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  banking:
    build:
      context: ./backend
      dockerfile: transfer-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_JWKS: http://keycloak:8080/realms/nusantara/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP: kafka:29092
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    environment:
      BANKING_URL: http://banking:8081
      REDIS_HOST: redis
      AUTH_URL: http://auth:8086
      CUSTOMER_URL: http://customer:8083
      ACCOUNT_URL: http://account:8084
      STATEMENT_URL: http://statement:8085
      NOTIFICATION_URL: http://notifications:8082
    depends_on: [banking,redis,auth,customer,account,statement]
    ports: ["127.0.0.1:8080:8080"]
  notifications:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      OIDC_JWKS: http://keycloak:8080/realms/nusantara/protocol/openid-connect/certs
    depends_on:
      banking:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
  auth:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_JWKS: http://keycloak:8080/realms/nusantara/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      banking:
        condition: service_healthy
    ports: ["127.0.0.1:8086:8086"]
  customer:
    build:
      context: ./backend
      dockerfile: customer-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_JWKS: http://keycloak:8080/realms/nusantara/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      banking:
        condition: service_healthy
    ports: ["127.0.0.1:8083:8083"]
  account:
    build:
      context: ./backend
      dockerfile: account-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_JWKS: http://keycloak:8080/realms/nusantara/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      banking:
        condition: service_healthy
    ports: ["127.0.0.1:8084:8084"]
  statement:
    build:
      context: ./backend
      dockerfile: statement-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/banking
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_JWKS: http://keycloak:8080/realms/nusantara/protocol/openid-connect/certs
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      banking:
        condition: service_healthy
    ports: ["127.0.0.1:8085:8085"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on: [gateway]
volumes:
  postgres-data:
