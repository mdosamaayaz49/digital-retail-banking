server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8180; frame-src http://localhost:8180; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://gateway:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
