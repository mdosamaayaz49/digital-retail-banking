apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-core-ingress
spec:
  podSelector:
    matchLabels:
      app: banking
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8081
